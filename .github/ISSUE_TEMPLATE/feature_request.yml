name: 功能建议
description: 提出一个新功能或改进
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景，而不是先描述方案
      placeholder: 我有三台机器，每次换机都要手工重建链接，容易漏
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的做法
      placeholder: 希望 skillhub 能导出/导入一份可移植的上架名单
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - CLI
        - 可视化控制台
        - MCP
        - 工具接入（新工具）
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 我理解本项目坚持零运行时依赖
          required: true
