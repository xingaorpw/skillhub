name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run even without commits: catches "a new Node release broke us" and
  # "an action got deprecated" without waiting for a human to push something.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
        exclude:
          - os: windows-latest
            node: 18
          - os: macos-latest
            node: 18

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Static checks
        run: node scripts/check.js

      - name: Unit tests
        run: node scripts/test.js

      - name: End-to-end smoke test
        run: node scripts/smoke.js
