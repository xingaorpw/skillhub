<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillHub · 技能中心</title>
    <meta name="description" content="一个技能中心，所有 AI 工具共用同一份 skill。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.6 3.4 7v10L12 21.4 20.6 17V7L12 2.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M12 7.2 7.4 9.6v4.8L12 16.8l4.6-2.4V9.6L12 7.2Z" fill="currentColor" opacity=".22" />
            <circle cx="12" cy="12" r="1.7" fill="currentColor" />
          </svg>
          <span class="brand-name">SkillHub</span>
          <span class="brand-version" id="version">v0.2.0</span>
        </div>

        <nav class="nav" id="nav" aria-label="主导航"></nav>

        <div class="sidebar-foot">
          <div class="foot-line" id="footPlatform">—</div>
          <div class="foot-line muted" id="footHub">—</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="cmdk-trigger" id="cmdkTrigger" aria-label="打开命令面板">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7" fill="none" />
              <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
            <span class="cmdk-label">搜索技能、执行操作…</span>
            <span class="cmdk-keys"><kbd>Ctrl</kbd><kbd>K</kbd></span>
          </button>

          <div class="topbar-right">
            <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
                <circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.6" fill="none" />
              </svg>
            </button>
            <button class="btn primary" id="installBtn">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path d="M12 5v10m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              </svg>
              安装技能
            </button>
          </div>
        </header>

        <div class="content" id="content" aria-live="polite"></div>
      </main>
    </div>

    <aside class="drawer" id="drawer" aria-hidden="true" aria-label="技能详情">
      <div class="drawer-head">
        <div class="drawer-title">
          <h2 id="drawerName"></h2>
          <p id="drawerDesc" class="drawer-desc"></p>
        </div>
        <button class="icon-btn" id="drawerClose" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="drawer-meta" id="drawerMeta"></div>
      <div class="drawer-body markdown" id="drawerBody"></div>
      <div class="drawer-foot">
        <button class="btn ghost" id="drawerCopy">复制路径</button>
        <button class="btn danger ghost" id="drawerDelete">从中心删除</button>
        <button class="btn primary" id="drawerToggle">上架</button>
      </div>
    </aside>

    <dialog class="modal" id="installModal">
      <form id="installForm" method="dialog">
        <h2>安装技能</h2>
        <p class="modal-hint">
          支持 <code>owner/repo</code>、GitHub 链接（可带 <code>/tree/分支/子目录</code>），或本机文件夹路径。
          也可以直接把技能文件夹拖到窗口里。
        </p>
        <input id="installInput" type="text" placeholder="mattpocock/skills" autocomplete="off" spellcheck="false" />
        <label class="check">
          <input type="checkbox" id="installOverwrite" />
          <span>覆盖同名技能</span>
        </label>
        <div class="modal-actions">
          <button class="btn ghost" type="submit" value="cancel" formnovalidate>取消</button>
          <button class="btn primary" id="installSubmit" type="submit" value="ok">开始安装</button>
        </div>
      </form>
    </dialog>

    <div class="palette" id="palette" hidden>
      <div class="palette-box" role="dialog" aria-modal="true" aria-label="命令面板">
        <div class="palette-input">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7" fill="none" />
            <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <input id="paletteInput" type="text" placeholder="输入技能名或命令…" autocomplete="off" spellcheck="false" />
          <kbd>Esc</kbd>
        </div>
        <div class="palette-list" id="paletteList" role="listbox"></div>
        <div class="palette-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
          <span><kbd>Enter</kbd> 执行</span>
          <span><kbd>Esc</kbd> 关闭</span>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="dropzone" id="dropzone" hidden>
      <div class="dropzone-inner">
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
          <path d="M12 16V4m0 0 4.5 4.5M12 4 7.5 8.5M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
        <strong>松开即可安装</strong>
        <span>拖入包含 SKILL.md 的文件夹</span>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
